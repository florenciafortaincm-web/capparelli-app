/* ══════════════════════════════════════════════
   PHOTO SLOT — zoom (botones o scroll) + drag para mover
══════════════════════════════════════════════ */
function PhotoSlot({url,bg="#2a2a2a"}){
  const [zoom,setZoom]=useState(1);
  const [off,setOff]=useState({x:0,y:0});
  const [hover,setHover]=useState(false);
  const drag=useRef(false),last=useRef({x:0,y:0}),el=useRef();

  useEffect(()=>{setZoom(1);setOff({x:0,y:0});},[url]);

  const clamp=(o,z)=>{
    const w=el.current?el.current.clientWidth:200;
    const h=el.current?el.current.clientHeight:200;
    const limX=(z-1)*w/2, limY=(z-1)*h/2;
    return{x:Math.max(-limX,Math.min(limX,o.x)),y:Math.max(-limY,Math.min(limY,o.y))};
  };;
  const setZ=nz=>{nz=Math.max(1,Math.min(4,nz));setZoom(nz);setOff(o=>nz<=1.01?{x:0,y:0}:clamp(o,nz));};

  useEffect(()=>{
    const e=el.current; if(!e)return;
    const fn=ev=>{ev.preventDefault();setZ(zoom-ev.deltaY*.0025);};
    e.addEventListener('wheel',fn,{passive:false});
    return()=>e.removeEventListener('wheel',fn);
  },[zoom]);

  const dragRef=useRef(null);
  const onPD=e=>{
    if(!url)return;
    try{e.currentTarget.setPointerCapture(e.pointerId);}catch(_){}
    dragRef.current={x:e.clientX,y:e.clientY};
    e.preventDefault();
  };
  const onPM=e=>{
    if(!dragRef.current)return;
    const dx=e.clientX-dragRef.current.x, dy=e.clientY-dragRef.current.y;
    dragRef.current={x:e.clientX,y:e.clientY};
    setOff(o=>clamp({x:o.x+dx,y:o.y+dy},zoom));
  };
  const onPU=e=>{dragRef.current=null;try{e.currentTarget.releasePointerCapture(e.pointerId);}catch(_){}};
  const btn={width:22,height:22,border:"none",borderRadius:4,background:"rgba(20,20,20,.82)",color:"#fff",fontSize:13,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",lineHeight:1,fontFamily:PN};
  const bstop=fn=>e=>{e.stopPropagation();e.preventDefault();fn();};

  return <div ref={el}
    onMouseEnter={()=>setHover(true)} onMouseLeave={()=>setHover(false)}
    style={{width:"100%",height:"100%",overflow:"hidden",background:bg,userSelect:"none",touchAction:"none",cursor:url?(zoom>1.01?"move":"grab"):"default",position:"relative"}}
    onPointerDown={onPD} onPointerMove={onPM} onPointerUp={onPU} onPointerCancel={onPU}
    title="Botones o scroll = zoom · arrastrá = mover">
    {url&&<img src={url} draggable={false}
      style={{width:"100%",height:"100%",objectFit:"cover",
        transform:`scale(${zoom}) translate(${off.x/zoom}px,${off.y/zoom}px)`,
        transformOrigin:"center",pointerEvents:"none"}}/>}
    {!url&&<div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center"}}>
      <span style={{color:"rgba(255,255,255,.2)",fontSize:10,fontFamily:PN}}>sin foto</span>
    </div>}
    {url&&hover&&<div data-noexport="1" style={{position:"absolute",bottom:6,right:6,display:"flex",gap:3,zIndex:6}}>
      <button style={btn} onMouseDown={bstop(()=>setZ(zoom-.3))} title="Alejar">−</button>
      <button style={{...btn,fontSize:11}} onMouseDown={bstop(()=>setZ(1))} title="Restablecer">↺</button>
      <button style={btn} onMouseDown={bstop(()=>setZ(zoom+.3))} title="Acercar">+</button>
    </div>}
    {url&&hover&&zoom>1.01&&<div data-noexport="1" style={{position:"absolute",top:6,left:6,background:"rgba(20,20,20,.82)",color:"#fff",fontSize:9,fontWeight:700,padding:"2px 6px",borderRadius:3,fontFamily:PN,zIndex:6,pointerEvents:"none"}}>{Math.round(zoom*100)}%</div>}
  </div>;
}

/* ── Drag (logo / matrícula) ── */
function Drag({W,H,ix=10,iy=10,children}){
  const [pos,setPos]=useState({x:ix,y:iy});
  const dr=useRef(false),off=useRef({x:0,y:0}),el=useRef();
  const xy=e=>e.touches?{x:e.touches[0].clientX,y:e.touches[0].clientY}:{x:e.clientX,y:e.clientY};
  const go=e=>{
    e.stopPropagation();e.preventDefault();dr.current=true;
    const{x,y}=xy(e),r=el.current.getBoundingClientRect();
    off.current={x:x-r.left,y:y-r.top};
    window.addEventListener("mousemove",mv);window.addEventListener("mouseup",stop);
    window.addEventListener("touchmove",mv,{passive:false});window.addEventListener("touchend",stop);
  };
  const mv=e=>{
    if(!dr.current)return;e.preventDefault();
    const{x,y}=xy(e),p=el.current.parentElement.getBoundingClientRect();
    setPos({x:Math.min(W-60,Math.max(0,x-p.left-off.current.x)),y:Math.min(H-20,Math.max(0,y-p.top-off.current.y))});
  };
  const stop=()=>{dr.current=false;window.removeEventListener("mousemove",mv);window.removeEventListener("mouseup",stop);window.removeEventListener("touchmove",mv);window.removeEventListener("touchend",stop);};
  return <div ref={el} onMouseDown={go} onTouchStart={go}
    style={{position:"absolute",left:pos.x,top:pos.y,cursor:"grab",userSelect:"none",zIndex:40,touchAction:"none"}}>
    {children}
  </div>;
}

function SLogo({brand,logoPos,logoLight,vert=false,W,H,logoMb}){
  const b=BR[brand],sc=W/1080;
  const ml=50*sc,mt=140*sc;
  /* "abajo" = pegado al borde superior de la LZ (H*0.18), logo descansa sobre la zona link.
     logoMb permite a layouts con bandas adicionales (ej: barra de features) reubicar el logo dentro de la LZ */
  const mb=logoMb!==undefined?logoMb:Math.round(H*.185);
  const lh=vert?160*sc:80*sc;
  const pos={
    1:{left:ml,top:mt},
    2:{right:ml,top:mt},
    3:{left:"50%",top:"50%",transform:"translate(-50%,-50%)"},
    4:{left:ml,bottom:mb},
    5:{right:ml,bottom:mb},
  }[logoPos]||{right:ml,top:mt};
  return <div style={{position:"absolute",...pos,zIndex:40,pointerEvents:"none"}}>
    {vert?<b.V h={lh} light={logoLight}/>:<b.H h={lh} light={logoLight}/>}
  </div>;

/* LogoOverlay — unifica modo fijo (SLogo) y libre (SDragLogo) para todos los layouts */

/* ── Photo Manager ── */
function PhotoMgr({photos,setPhotos,selected,setSelected}){
  const ref=useRef();
  const [dragging,setDragging]=useState(null);
  const [dragOver,setDragOver]=useState(null);
  const add=files=>{Array.from(files).slice(0,10-photos.length).forEach(f=>{const r=new FileReader();r.onload=e=>setPhotos(p=>[...p,{url:e.target.result,id:Math.random()}]);r.readAsDataURL(f);});};
  const tog=id=>setSelected(p=>p.includes(id)?p.filter(x=>x!==id):[...p,id]);
  const up=id=>setSelected(p=>{const i=p.indexOf(id);if(i<=0)return p;const a=[...p];[a[i-1],a[i]]=[a[i],a[i-1]];return a;});
  const dn=id=>setSelected(p=>{const i=p.indexOf(id);if(i<0||i>=p.length-1)return p;const a=[...p];[a[i],a[i+1]]=[a[i+1],a[i]];return a;});
  const onDragStart=id=>e=>{setDragging(id);e.dataTransfer.effectAllowed="move";};
  const onDragOver=id=>e=>{e.preventDefault();e.dataTransfer.dropEffect="move";if(id!==dragging)setDragOver(id);};
  const onDrop=id=>e=>{
    e.preventDefault();
    if(!dragging||dragging===id){setDragging(null);setDragOver(null);return;}
    setSelected(p=>{
      const from=p.indexOf(dragging),to=p.indexOf(id);
      if(from<0||to<0)return p;
      const a=[...p];a.splice(from,1);a.splice(to,0,dragging);return a;
    });
    setDragging(null);setDragOver(null);
  };
  const onDragEnd=()=>{setDragging(null);setDragOver(null);};
  return <div>
    <div onDrop={e=>{e.preventDefault();add(e.dataTransfer.files);}} onDragOver={e=>e.preventDefault()} onClick={()=>ref.current.click()}
      style={{border:"2px dashed #ffc62d",borderRadius:9,padding:"12px",textAlign:"center",cursor:"pointer",background:"#fafafa",marginBottom:8}}>
      <div style={{fontFamily:PN,fontWeight:600,fontSize:12,color:C.d}}>Arrastrá o hacé click · máx 10</div>
      <div style={{fontFamily:PN,fontSize:10,color:C.g,marginTop:2}}>Zoom con botones o scroll · arrastrá para mover</div>
      <input ref={ref} type="file" multiple accept="image/*" style={{display:"none"}} onChange={e=>add(e.target.files)}/>
    </div>
    {photos.length>0&&<>
      <div style={{fontFamily:PN,fontSize:9,fontWeight:700,color:"#999",letterSpacing:.5,textTransform:"uppercase",marginBottom:4}}>Tocá para seleccionar · arrastrá para reordenar</div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:4}}>
        {photos.map(p=>{
          const si=selected.indexOf(p.id),isSel=si>=0;
          const isDragging=dragging===p.id,isOver=dragOver===p.id&&isSel;
          return <div key={p.id}
            draggable={isSel}
            onDragStart={isSel?onDragStart(p.id):undefined}
            onDragOver={isSel?onDragOver(p.id):undefined}
            onDrop={isSel?onDrop(p.id):undefined}
            onDragEnd={onDragEnd}
            style={{position:"relative",aspectRatio:"1",borderRadius:5,overflow:"hidden",
              border:`2.5px solid ${isSel?"#ffc62d":"#DDD"}`,
              cursor:isSel?"grab":"pointer",
              opacity:isDragging?.35:1,
              transition:"opacity .15s"}}
            onClick={()=>tog(p.id)}>
            <img src={p.url} style={{width:"100%",height:"100%",objectFit:"cover"}}/>
            {isOver&&<div style={{position:"absolute",left:0,top:0,bottom:0,width:4,background:"#ffc62d",zIndex:8}}/>}
            {isOver&&<div style={{position:"absolute",inset:0,background:"rgba(255,198,45,.15)",zIndex:7,pointerEvents:"none"}}/>}
            {isSel&&<div style={{position:"absolute",top:2,left:2,background:"#ffc62d",color:"#111",fontSize:8,fontWeight:800,width:14,height:14,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontFamily:PN,zIndex:5}}>{si+1}</div>}
            <button onClick={e=>{e.stopPropagation();setPhotos(prev=>prev.filter(x=>x.id!==p.id));setSelected(prev=>prev.filter(x=>x!==p.id));}}
              style={{position:"absolute",top:2,right:2,background:"rgba(0,0,0,.7)",color:"white",border:"none",borderRadius:"50%",width:13,height:13,cursor:"pointer",fontSize:7,display:"flex",alignItems:"center",justifyContent:"center",zIndex:5}}>x</button>
          </div>;
        })}
      </div>
    </>}
  </div>;
}

function DLBtn({targetRef,fname,accent}){
  const [loading,setLoading]=useState(false);
  const go=async()=>{
    setLoading(true);
    try{const cv=await html2canvas(targetRef.current,{useCORS:true,allowTaint:true,scale:3.375,backgroundColor:null,ignoreElements:el=>el.dataset&&el.dataset.noexport==="1"});const a=document.createElement("a");a.download=fname;a.href=cv.toDataURL("image/jpeg",0.92);a.click();}
    catch(e){alert("Error: "+e.message);}
    finally{setLoading(false);}
  };
  return <button onClick={go} disabled={loading}
    style={{display:"flex",alignItems:"center",justifyContent:"center",gap:6,padding:"10px 14px",background:loading?"#CCC":accent,color:C.d,border:"none",borderRadius:8,fontFamily:PN,fontWeight:800,fontSize:12,cursor:loading?"not-allowed":"pointer",width:"100%"}}>
    {loading?"⏳ Generando…":"⬇️ Descargar imagen"}
  </button>;
}

  const [selected,setSelected]=useState([]);
  const [mode,setMode]=useState("story");
  const [stL,setStL]=useState("A");
  const [slide,setSlide]=useState(0);
  const [lt,setLt]=useState("full");
  const [logoPos,setLogoPos]=useState(2);
  const [logoLight,setLogoLight]=useState(true);
  const [logoVert,setLogoVert]=useState(false);
  const [logoMode,setLogoMode]=useState("fixed"); // "fixed"|"libre"
  const [showSafe,setShowSafe]=useState(false);
  const [labels,setLabels]=useState([]);
  const [data,setData]=useState(DEMO);
  const [panelOpen,setPanelOpen]=useState(false);
  const [inputMode,setInputMode]=useState("manual");
  const [autoSubMode,setAutoSubMode]=useState("url");
  const [autoUrl,setAutoUrl]=useState("");
  const [pasteContent,setPasteContent]=useState("");
  const [autoStatus,setAutoStatus]=useState("idle");
  const [autoMsg,setAutoMsg]=useState("");
  const pRef=useRef();

  useEffect(()=>{setLabels(p=>Array.from({length:selected.length},(_,i)=>p[i]||{title:"",sub:""}));},[selected.length]);

  const upd=k=>v=>setData(p=>({...p,[k]:v}));
  const updA=(i,k)=>v=>setData(p=>{const a=[...p.agentes];a[i]={...a[i],[k]:v};return{...p,agentes:a};});
  const updL=(i,k)=>v=>setLabels(p=>{const l=[...p];l[i]={...(l[i]||{}),[k]:v};return l;});

  const callProxy=(body)=>
    fetch("/.netlify/functions/proxy",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(body)
    });

  const applyEx=(ex)=>{
    const n=s=>String(s||"").trim();
    const op=n(ex.op).toLowerCase().includes("alquiler")?"alquiler":"venta";
    const mon=n(ex.moneda)||(op==="alquiler"?"$":"USD");
    setData(prev=>({...prev,tipo:n(ex.tipo)||prev.tipo,op,
      m2:n(ex.m2),amb:n(ex.amb),dorm:n(ex.dorm),ban:n(ex.ban),gar:n(ex.gar),pool:!!ex.pool,
      precio:n(ex.precio),moneda:mon,expensas:n(ex.expensas),monedaExp:n(ex.monedaExp)||"$",
      dir:n(ex.dir),badge:n(ex.badge)}));
    const fotos=(ex.fotos||[]).filter(u=>typeof u==="string"&&u.startsWith("http")).slice(0,10);
    if(fotos.length){const np=fotos.map(u=>({url:u,id:Math.random()}));setPhotos(np);setSelected(np.map(p=>p.id));}
    return {op,nF:fotos.length};
  };

  const parseRes=async(res)=>{
    const txt=await res.text();
    if(!txt)throw new Error("El servidor no respondió.");
    let d;try{d=JSON.parse(txt);}catch{throw new Error("Respuesta inválida: "+txt.substring(0,100));}
    if(!res.ok||d.error)throw new Error(d.error||"Error "+res.status);
    return d;
  };

  const fmtErr=err=>{
    const m=String(err.message||err);
    if(m.includes("NetworkError")||m.includes("Failed to fetch"))return"Sin conexión o el servidor no responde. Verificá tu red.";
    if(m.includes("404"))return"La URL no existe (404). Verificá que el link sea válido y público.";
    if(m.includes("403")||m.includes("401"))return"La página bloqueó el acceso (403/401). Usá el modo Pegar texto.";
    if(m.includes("500")||m.includes("502")||m.includes("503"))return"Error del servidor ("+m.match(/\d{3}/)?.[0]+"). Intentá de nuevo en unos segundos.";
    if(m.includes("timeout")||m.includes("Timeout"))return"La solicitud tardó demasiado. Intentá de nuevo o usá Pegar texto.";
    return m;
  };

  const loadFromUrl=async()=>{
    if(!autoUrl.trim()){setAutoMsg("Pegá una URL.");return;}
    setAutoStatus("loading");setAutoMsg("Analizando propiedad...");
    try{
      const ex=await parseRes(await callProxy({url:autoUrl.trim()}));
      const {op,nF}=applyEx(ex);
      setAutoMsg("Listo. Operacion: "+op+(nF?" · "+nF+" fotos cargadas":" · Subi fotos manualmente")+". Revisa los datos.");
      setAutoStatus("done");
    }catch(err){setAutoStatus("error");setAutoMsg(fmtErr(err));}
  };

  const loadFromPaste=async()=>{
    const raw=pasteContent.trim();
    if(!raw){setAutoMsg("Pegá el contenido primero.");return;}
    setAutoStatus("loading");setAutoMsg("Analizando...");
    try{
      const ex=await parseRes(await callProxy({text:raw.substring(0,20000)}));
      const {op,nF}=applyEx(ex);
      setAutoMsg("Listo. Operacion: "+op+(nF?" · "+nF+" fotos cargadas":" · Subi fotos manualmente")+". Revisa los datos.");
      setAutoStatus("done");
    }catch(err){setAutoStatus("error");setAutoMsg(fmtErr(err));}
  };

  const b=BR[brand];
  const selPhotos=selected.map(id=>photos.find(p=>p.id===id)).filter(Boolean);
  const ph=selPhotos.map(p=>p.url);
  const carSlides=[{type:"cover"},...selPhotos.slice(1).map((_,i)=>({type:"photo",idx:i+1})),{type:"cta"}];
  const total=carSlides.length;
  const tipoOpts=["Departamento","Casa","Dúplex","Triplex","PH","Local","Oficina","Terreno","Cochera"].map(v=>({v,l:v}));
  const opOpts=["venta","alquiler","alquiler temporal"].map(v=>({v,l:v[0].toUpperCase()+v.slice(1)}));
  const SC=LMAP[stL]||LA;
  const W=320;

  const Tab=({id,label})=>
    <button onClick={()=>setMode(id)} style={{flex:1,padding:"8px 0",border:"none",cursor:"pointer",borderRadius:8,fontFamily:PN,fontWeight:700,fontSize:11,letterSpacing:.6,textTransform:"uppercase",background:mode===id?b.bg:"transparent",color:mode===id?"white":C.m}}>
      {label}
    </button>;

  return <div style={{minHeight:"100vh",background:"#F3F3F3"}}>
    {/* Header */}
    <div style={{background:b.bg,padding:"12px 20px",display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
      <b.H h={30} light={true}/>
      <div style={{width:1,height:24,background:"rgba(255,255,255,.2)"}}/>
      <span style={{color:"rgba(255,255,255,.45)",fontSize:10,letterSpacing:2,textTransform:"uppercase"}}>Generador de Plantillas</span>
      <div style={{marginLeft:"auto",display:"flex",gap:6}}>
        {Object.values(BR).map(br=><button key={br.id} onClick={()=>setBrand(br.id)}
          style={{padding:"5px 12px",border:`2px solid ${brand===br.id?br.acc:"rgba(255,255,255,.2)"}`,borderRadius:18,fontFamily:PN,fontSize:9,fontWeight:700,cursor:"pointer",background:brand===br.id?"rgba(255,255,255,.12)":"transparent",color:brand===br.id?"white":"rgba(255,255,255,.45)"}}>
          {br.name.split(" ")[0].toUpperCase()}
        </button>)}
      </div>
    </div>

    {/* Main grid */}
    <div className="col2" style={{maxWidth:1100,margin:"0 auto",padding:"16px 14px",display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}>

      {/* LEFT */}
      <div className={"panel-left-col"+(panelOpen?" open":"")}>
        <button className="panel-close-btn" onClick={()=>setPanelOpen(false)} style={{color:b.bg}}>
          Cerrar panel
        </button>
                <Card title="Modo de carga" collapsible>
          <div style={{display:"flex",gap:6,marginBottom:10}}>
            {[["manual","Manual"],["auto","Automatico"]].map(([id,label])=>
              <button key={id} onClick={()=>{setInputMode(id);setAutoStatus("idle");setAutoMsg("");}}
                style={{flex:1,padding:"8px 6px",borderRadius:8,cursor:"pointer",
                  border:"2px solid "+(inputMode===id?b.acc:"#E0E0E0"),
                  fontFamily:PN,fontWeight:700,fontSize:11,
                  background:inputMode===id?"#FFF8E1":"white",color:inputMode===id?C.d:C.m}}>
                {label}
              </button>
            )}
          </div>
          {inputMode==="auto"&&<>
            <div style={{display:"flex",gap:4,marginBottom:8,background:"#F5F5F5",borderRadius:8,padding:3}}>
              {[["url","Desde URL"],["paste","Pegar texto"]].map(([id,label])=>
                <button key={id} onClick={()=>{setAutoSubMode(id);setAutoStatus("idle");setAutoMsg("");}}
                  style={{flex:1,padding:"6px 4px",border:"none",borderRadius:6,cursor:"pointer",
                    fontFamily:PN,fontWeight:700,fontSize:11,
                    background:autoSubMode===id?"white":"transparent",
                    color:autoSubMode===id?C.d:C.m,
                    boxShadow:autoSubMode===id?"0 1px 3px rgba(0,0,0,.12)":"none"}}>
                  {label}
                </button>
              )}
            </div>
            {autoSubMode==="url"&&<>
              <div style={{fontSize:11,fontFamily:PN,color:C.m,marginBottom:6}}>
                Pegá la URL de la ficha y el sistema extrae todo automaticamente.
              </div>
              <div style={{display:"flex",gap:6}}>
                <input value={autoUrl} onChange={e=>setAutoUrl(e.target.value)}
                  onKeyDown={e=>e.key==="Enter"&&loadFromUrl()}
                  placeholder="https://capparellipropiedades.com/propiedad/..."
                  style={{flex:1,padding:"7px 10px",border:"1.5px solid #D0D0D0",
                    borderRadius:7,fontFamily:PN,fontSize:11,outline:"none"}}/>
                <button onClick={loadFromUrl} disabled={autoStatus==="loading"}
                  style={{padding:"7px 16px",border:"none",borderRadius:7,whiteSpace:"nowrap",
                    cursor:autoStatus==="loading"?"not-allowed":"pointer",
                    background:autoStatus==="loading"?"#ccc":b.acc,
                    fontFamily:PN,fontWeight:800,fontSize:11,color:C.d}}>
                  {autoStatus==="loading"?"Cargando...":"Cargar"}
                </button>
              </div>
            </>}
            {autoSubMode==="paste"&&<>
              <div style={{fontSize:11,fontFamily:PN,lineHeight:1.6,marginBottom:6,
                background:"#FFFBE6",border:"1px solid #FFE082",borderRadius:6,padding:"8px 10px",color:C.d}}>
                <strong>Como hacerlo:</strong><br/>
                1. Abrí la ficha en Chrome<br/>
                2. <strong>Ctrl+A</strong> y luego <strong>Ctrl+C</strong><br/>
                3. Pegá acá con <strong>Ctrl+V</strong>
              </div>
              <textarea value={pasteContent} onChange={e=>setPasteContent(e.target.value)}
                placeholder="Pegá el contenido de la pagina..."
                style={{width:"100%",minHeight:90,padding:"8px 10px",boxSizing:"border-box",
                  border:"1.5px solid #D0D0D0",borderRadius:7,fontFamily:PN,fontSize:11,
                  outline:"none",resize:"vertical",lineHeight:1.4}}/>
              <button onClick={loadFromPaste} disabled={autoStatus==="loading"||!pasteContent.trim()}
                style={{marginTop:6,width:"100%",padding:"8px 0",border:"none",borderRadius:7,
                  fontFamily:PN,fontWeight:800,fontSize:12,color:C.d,
                  background:(!pasteContent.trim()||autoStatus==="loading")?"#ccc":b.acc,
                  cursor:(!pasteContent.trim()||autoStatus==="loading")?"not-allowed":"pointer"}}>
                {autoStatus==="loading"?"Analizando...":"Extraer datos"}
              </button>
            </>}
            {autoMsg&&<div style={{marginTop:8,padding:"7px 10px",borderRadius:6,
              fontFamily:PN,fontSize:11,lineHeight:1.5,
              background:autoStatus==="done"?"#F0FFF4":autoStatus==="error"?"#FFF0F0":"#FFFBE6",
              color:autoStatus==="done"?"#2E7D32":autoStatus==="error"?"#C62828":"#7B5B00",
              border:"1px solid "+(autoStatus==="done"?"#A5D6A7":autoStatus==="error"?"#FFCDD2":"#FFE082")}}>
              {autoMsg}
              {autoStatus==="error"&&<div style={{marginTop:7}}>
                <button onClick={()=>{setInputMode("manual");setAutoStatus("idle");setAutoMsg("");}}
                  style={{padding:"5px 12px",border:"none",borderRadius:6,cursor:"pointer",
                    fontFamily:PN,fontWeight:800,fontSize:10,background:"#C62828",color:"white"}}>
                  Completar manualmente
                </button>
              </div>}
            </div>}
          </>}
        </Card>

<Card title="Fotos" collapsible>
          <PhotoMgr photos={photos} setPhotos={setPhotos} selected={selected} setSelected={setSelected}/>
        </Card>

        <Card title="Propiedad" collapsible>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 10px"}}>
            <Sel label="Tipo" value={data.tipo} onChange={upd("tipo")} options={tipoOpts}/>
            <Sel label="Operación" value={data.op} onChange={upd("op")} options={opOpts}/>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:"0 6px"}}>
            <Inp small label="M²"    value={data.m2}   onChange={upd("m2")}   placeholder="220"/>
            <Inp small label="Amb."  value={data.amb}  onChange={upd("amb")}  placeholder="5"/>
            <Inp small label="Dorm." value={data.dorm} onChange={upd("dorm")} placeholder="4"/>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:"0 6px"}}>
            <Inp small label="Baños" value={data.ban}  onChange={upd("ban")}  placeholder="3"/>
            <Inp small label="Coch." value={data.gar}  onChange={upd("gar")}  placeholder="2"/>
            <div style={{marginBottom:5}}>
              <label style={{display:"block",fontFamily:PN,fontSize:10,fontWeight:700,color:C.m,letterSpacing:.6,marginBottom:2,textTransform:"uppercase"}}>Pileta</label>
              <button onClick={()=>upd("pool")(!data.pool)} style={{padding:"5px 12px",border:`1.5px solid ${data.pool?"#ffc62d":"#E0E0E0"}`,borderRadius:6,fontFamily:PN,fontSize:11,fontWeight:700,cursor:"pointer",background:data.pool?"#FFF8E1":"white",color:data.pool?C.d:C.m}}>
                {data.pool?"✓ Sí":"No"}
              </button>
            </div>
          </div>
          <MRow label="Precio" value={data.precio} onChange={upd("precio")} moneda={data.moneda} onMoneda={upd("moneda")} placeholder="237.000"/>
          <MRow label="Expensas (opcional)" value={data.expensas} onChange={upd("expensas")} moneda={data.monedaExp} onMoneda={upd("monedaExp")} placeholder="85.000"/>
          <Inp label="Dirección" value={data.dir}   onChange={upd("dir")}   placeholder="Calle 489 e/ 133 y 134 - Gonnet"/>
          <Inp label="Badge"     value={data.badge} onChange={upd("badge")} placeholder="Oportunidad · A estrenar"/>
        </Card>

        {mode==="feed"&&selPhotos.length>1&&
          <Card title="Texto por foto" collapsible>
            {selPhotos.slice(1).map((p,i)=>(
              <div key={p.id} style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 6px",paddingBottom:4,borderBottom:"1px solid #eee",marginBottom:5}}>
                <Inp small label={`Foto ${i+2}`}  value={labels[i+1]?.title||""} onChange={updL(i+1,"title")} placeholder="Living"/>
                <Inp small label="Subtítulo"       value={labels[i+1]?.sub||""}   onChange={updL(i+1,"sub")}   placeholder="amplio"/>
              </div>
            ))}
          </Card>
        }

        <Card title="Agentes" collapsible defaultOpen={false}>
          {data.agentes.map((a,i)=>(
            <div key={i} style={{marginBottom:10,paddingBottom:10,borderBottom:i<2?"1px solid #f0f0f0":"none"}}>
              {/* Toggle agente */}
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
                <span style={{fontFamily:PN,fontSize:10,fontWeight:700,color:C.m,textTransform:"uppercase",letterSpacing:.5}}>Agente {i+1}</span>
                <button onClick={()=>updA(i,"on")(!a.on)} style={{
                  padding:"3px 10px",border:`1.5px solid ${a.on?"#ffc62d":"#DDD"}`,borderRadius:12,
                  fontFamily:PN,fontSize:9,fontWeight:700,cursor:"pointer",
                  background:a.on?"#FFF8E1":"white",color:a.on?C.d:C.g}}>
                  {a.on?"● Visible":"○ Oculto"}
                </button>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 6px",opacity:a.on?1:.4}}>
                <Inp small label="Nombre" value={a.n} onChange={updA(i,"n")} placeholder={`Agente ${i+1}`}/>
                <Inp small label="Teléfono" value={a.t} onChange={updA(i,"t")} placeholder="+54 9 221..."/>
              </div>
            </div>
          ))}
        </Card>
      </div>

      {/* RIGHT */}
      <div>
        <Card>
          <div style={{display:"flex",background:"#F0F0F0",borderRadius:10,padding:3,marginBottom:12}}>
            <Tab id="feed" label="⬛ Carrusel Feed"/>
            <Tab id="story" label="📱 Historia"/>
          </div>

          {/* Logo — story: fijo (5pos+H/V+tono) o libre (drag+H/V+tono) | feed: H/V */}
          {mode==="story"&&<>
            {/* Toggle fijo/libre */}
            <div style={{display:"flex",gap:4,marginBottom:8}}>
              {[{id:"fixed",l:"Fijo"},{id:"libre",l:"Posición libre"}].map(o=>
                <button key={o.id} onClick={()=>setLogoMode(o.id)} style={{flex:1,padding:"5px 0",border:`2px solid ${logoMode===o.id?b.acc:"#DDD"}`,borderRadius:6,fontFamily:PN,fontWeight:700,fontSize:9,cursor:"pointer",background:logoMode===o.id?"#FFF8E1":"white",color:logoMode===o.id?C.d:C.m}}>{o.l}</button>
              )}
            </div>
            {/* H/V siempre visible */}
            <div style={{display:"flex",gap:4,marginBottom:7}}>
              {[{id:false,l:"Horizontal"},{id:true,l:"Vertical"}].map(o=>
                <button key={String(o.id)} onClick={()=>setLogoVert(o.id)} style={{flex:1,padding:"5px 0",border:`2px solid ${logoVert===o.id?b.acc:"#DDD"}`,borderRadius:6,fontFamily:PN,fontWeight:700,fontSize:9,cursor:"pointer",background:logoVert===o.id?"#FFF8E1":"white",color:logoVert===o.id?C.d:C.m}}>{o.l}</button>
              )}
            </div>
            {/* Posición — solo en modo fijo */}
            {logoMode==="fixed"&&<div style={{marginBottom:8}}>
              <div style={{fontFamily:PN,fontSize:9,fontWeight:700,color:C.m,letterSpacing:.6,textTransform:"uppercase",marginBottom:5}}>Posición</div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:4,marginBottom:3}}>
                {[{id:1,l:"↖ Arriba izq."},{id:2,l:"Arriba der. ↗"}].map(o=>
                  <button key={o.id} onClick={()=>setLogoPos(o.id)} style={{padding:"5px 4px",border:`2px solid ${logoPos===o.id?b.acc:"#E0E0E0"}`,borderRadius:6,fontFamily:PN,fontWeight:700,fontSize:8,background:logoPos===o.id?"#FFF8E1":"white",color:logoPos===o.id?C.d:C.m,cursor:"pointer"}}>{o.l}</button>
                )}
              </div>
              <div style={{display:"flex",justifyContent:"center",marginBottom:3}}>
                <button onClick={()=>setLogoPos(3)} style={{width:"60%",padding:"5px 4px",border:`2px solid ${logoPos===3?b.acc:"#E0E0E0"}`,borderRadius:6,fontFamily:PN,fontWeight:700,fontSize:8,background:logoPos===3?"#FFF8E1":"white",color:logoPos===3?C.d:C.m,cursor:"pointer"}}>↕ Centro</button>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:4}}>
                {[{id:4,l:"↙ Abajo izq."},{id:5,l:"Abajo der. ↘"}].map(o=>
                  <button key={o.id} onClick={()=>setLogoPos(o.id)} style={{padding:"5px 4px",border:`2px solid ${logoPos===o.id?b.acc:"#E0E0E0"}`,borderRadius:6,fontFamily:PN,fontWeight:700,fontSize:8,background:logoPos===o.id?"#FFF8E1":"white",color:logoPos===o.id?C.d:C.m,cursor:"pointer"}}>{o.l}</button>
                )}
              </div>
            </div>}
            {logoMode==="libre"&&<div style={{marginBottom:8,padding:"8px 10px",background:"rgba(0,0,0,.04)",borderRadius:7,fontSize:9,color:C.g,fontFamily:PN,lineHeight:1.4}}>
              Arrastrá el logo directamente sobre el preview
            </div>}
            {/* Tono */}
            <div style={{display:"flex",gap:4,marginBottom:10,alignItems:"center"}}>
              <span style={{fontFamily:PN,fontSize:9,fontWeight:700,color:C.m,letterSpacing:.6,textTransform:"uppercase",flexShrink:0}}>Tono:</span>
              {[{id:true,l:"Claro"},{id:false,l:"Oscuro"}].map(o=>
                <button key={String(o.id)} onClick={()=>setLogoLight(o.id)} style={{flex:1,padding:"5px 0",border:`2px solid ${logoLight===o.id?b.acc:"#DDD"}`,borderRadius:6,fontFamily:PN,fontWeight:700,fontSize:10,cursor:"pointer",background:logoLight===o.id?"#FFF8E1":"white",color:logoLight===o.id?C.d:C.m}}>{o.l}</button>
              )}
            </div>
          </>}
          {mode==="feed"&&<div style={{display:"flex",gap:5,marginBottom:10,alignItems:"center"}}>
            <span style={{fontFamily:PN,fontSize:10,fontWeight:700,color:C.m,letterSpacing:.6,textTransform:"uppercase",flexShrink:0}}>Logo:</span>
            {[{id:"full",l:"Horizontal"},{id:"icon",l:"Vertical"}].map(o=>
              <button key={o.id} onClick={()=>setLt(o.id)} style={{flex:1,padding:"6px 0",border:`2px solid ${lt===o.id?b.acc:"#DDD"}`,borderRadius:7,fontFamily:PN,fontWeight:700,fontSize:10,cursor:"pointer",background:lt===o.id?"#FFF8E1":"white",color:lt===o.id?C.d:C.m}}>{o.l}</button>
            )}
          </div>}

          {/* FEED */}
          {mode==="feed"&&<>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
              <button onClick={()=>setSlide(s=>Math.max(0,s-1))} disabled={slide===0} style={{background:b.bg,color:"white",border:"none",borderRadius:7,width:28,height:28,cursor:"pointer",opacity:slide===0?.3:1,fontSize:16}}>‹</button>
              <div style={{textAlign:"center"}}>
                <div style={{fontFamily:PN,fontWeight:700,fontSize:12,color:C.d}}>Slide {slide+1} / {total}</div>
                <div style={{fontSize:10,color:C.g}}>{carSlides[slide]?.type==="cover"?"Portada":carSlides[slide]?.type==="cta"?"Contacto":"Foto ambiente"}</div>
              </div>
              <button onClick={()=>setSlide(s=>Math.min(total-1,s+1))} disabled={slide===total-1} style={{background:b.bg,color:"white",border:"none",borderRadius:7,width:28,height:28,cursor:"pointer",opacity:slide===total-1?.3:1,fontSize:16}}>›</button>
            </div>
            <div style={{display:"flex",gap:3,justifyContent:"center",marginBottom:10,flexWrap:"wrap"}}>
              {carSlides.map((_,i)=><div key={i} onClick={()=>setSlide(i)} style={{width:i===slide?16:6,height:6,borderRadius:3,background:i===slide?b.acc:"#CCC",cursor:"pointer"}}/>)}
            </div>
            <div style={{display:"flex",justifyContent:"center"}} ref={pRef}>
              {carSlides[slide]?.type==="cover"&&<FeedCover ph={ph} data={data} brand={brand} lt={lt} W={W} fRef={pRef}/>}
              {carSlides[slide]?.type==="photo"&&(()=>{const idx=carSlides[slide].idx,lb=labels[idx]||{title:"",sub:""};return<FeedSlide photo={ph[idx]} label={lb.title||`Ambiente ${idx}`} sub={lb.sub} idx={idx} brand={brand} lt={lt} W={W} fRef={pRef}/>;})()}
              {carSlides[slide]?.type==="cta"&&<FeedCTA data={data} brand={brand} W={W} fRef={pRef}/>}
            </div>
          </>}

          {/* STORY */}
          {mode==="story"&&<>
            <div style={{marginBottom:10}}>
              <div style={{fontFamily:PN,fontSize:9,fontWeight:700,color:C.m,letterSpacing:.6,textTransform:"uppercase",marginBottom:6}}>Disposición</div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:5}}>
                {SLAYS.map(({id,l})=><button key={id} onClick={()=>setStL(id)}
                  style={{padding:"6px 4px",border:`2px solid ${stL===id?b.acc:"#E0E0E0"}`,borderRadius:7,fontFamily:PN,fontWeight:700,fontSize:9,background:stL===id?"#FFF8E1":"white",color:stL===id?C.d:C.m,cursor:"pointer",textAlign:"center",lineHeight:1.3}}>
                  {l}
                </button>)}
              </div>
            </div>
            <div style={{display:"flex",justifyContent:"center"}}>
              <div style={{position:"relative",width:W,height:Math.round(W*16/9)}}>
                <SC ph={ph} data={data} brand={brand} lt={lt} logoPos={logoPos} logoLight={logoLight} logoVert={logoVert} logoMode={logoMode} W={W} slRef={pRef}/>
                {showSafe&&<SafeZones W={W} H={Math.round(W*16/9)}/>}
              </div>
            </div>
            <div style={{marginTop:8,display:"flex",gap:6,alignItems:"center"}}>
              <button onClick={()=>setShowSafe(v=>!v)} style={{flex:"0 0 auto",padding:"6px 11px",border:`2px solid ${showSafe?b.acc:"#DDD"}`,borderRadius:7,fontFamily:PN,fontWeight:700,fontSize:10,cursor:"pointer",background:showSafe?"#FFF8E1":"white",color:showSafe?C.d:C.m}}>{showSafe?"■":"□"} Zonas seguras</button>
              <div style={{flex:1,padding:"5px 10px",background:"rgba(0,0,0,.04)",borderRadius:6,fontSize:9.5,color:C.g,lineHeight:1.35}}>
                {showSafe?"Rojo = reloj/batería · azul = link IG. Nada crítico ahí.":"Zona punteada = espacio para link/sticker de Instagram"}
              </div>
            </div>
          </>}

          <div style={{marginTop:12}}><DLBtn targetRef={pRef} fname={`${brand}-${data.tipo}.jpg`} accent={b.acc}/></div>
          <div style={{marginTop:6,padding:"7px 12px",background:"#FFF8E1",borderRadius:7,fontSize:10,color:"#8B6914",textAlign:"center",lineHeight:1.5}}>
<b>Fotos</b>: zoom con botones o scroll · arrastrá para mover
          </div>
        </Card>
      </div>
    </div>
    <button className="panel-fab" onClick={()=>setPanelOpen(v=>!v)}
      style={{background:b.acc,color:C.d}}>
      {panelOpen?"Cerrar":"Datos y fotos"}
    </button>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
